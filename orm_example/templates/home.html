<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Articles</h1>

    <div>
        {% for article in articles %}

            <div> 
                <h2>{{ article.title }}</h2>
                <p>By: {{ article.author.username }}</p>
                <p>Posted: {{ article.created_at }}</p>
                <p>{{ article.content }}</p>
            </div>

        {% endfor %}
    </div>

    
</body>
</html>
